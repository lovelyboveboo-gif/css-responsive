<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browse by Job Categories</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
    </style>
</head>
<body class="bg-white py-12 px-4 flex justify-center items-center min-h-screen">

    <!-- Container หลัก ควบคุมขนาดและความกว้างสูงสุดให้พอดีกับมือถือและเดสก์ท็อป -->
    <div class="w-full max-w-[375px] sm:max-w-6xl mx-auto">
        
        <!-- หัวข้อหลัก -->
        <div class="text-center mb-10">
            <h2 class="text-2xl sm:text-4xl font-bold text-[#172033] tracking-tight">
                Browse by <span class="text-[#FF7033] underline decoration-2 underline-offset-4">Job</span> Categories
            </h2>
        </div>

        <!-- Grid สำหรับแสดงรายการ Category -->
        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            
            <!-- 1. Digital Marketing -->
            <div class="bg-white border border-gray-100 rounded-2xl p-6 shadow-sm hover:shadow-md transition-all duration-300 flex flex-col justify-between">
                <div class="flex items-center space-x-4 mb-6">
                    <div class="w-14 h-14 bg-[#FFF3EE] rounded-2xl flex items-center justify-center shrink-0">
                        <svg class="w-7 h-7 text-[#FF7033]" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M11 5.882V19.24a1.76 1.76 0 01-3.417.592l-2.147-6.15M18 13a3 3 0 100-6M5.436 13.683A4.001 4.001 0 017 6h1.832c4.1 0 7.625-1.234 9.168-3v14c-1.543-1.766-5.067-3-9.168-3H7a3.988 3.988 0 01-1.564-.317z"></path></svg>
                    </div>
                    <div>
                        <h3 class="text-base font-bold text-[#172033]">Digital Marketing</h3>
                        <p class="text-xs text-gray-500 mt-0.5">143 Jobs Opened</p>
                    </div>
                </div>
                <div class="flex justify-end">
                    <span class="w-8 h-8 rounded-full bg-gray-50 flex items-center justify-center text-[#172033] hover:bg-[#FF7033] hover:text-white transition-colors cursor-pointer">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"></path></svg>
                    </span>
                </div>
            </div>

            <!-- 2. Art & Design -->
            <div class="bg-white border border-gray-100 rounded-2xl p-6 shadow-sm hover:shadow-md transition-all duration-300 flex flex-col justify-between">
                <div class="flex items-center space-x-4 mb-6">
                    <div class="w-14 h-14 bg-[#FFF3EE] rounded-2xl flex items-center justify-center shrink-0">
                        <svg class="w-7 h-7 text-[#FF7033]" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>
                    </div>
                    <div>
                        <h3 class="text-base font-bold text-[#172033]">Art & Design</h3>
                        <p class="text-xs text-gray-500 mt-0.5">110 Jobs Opened</p>
                    </div>
                </div>
                <div class="flex justify-end">
                    <span class="w-8 h-8 rounded-full bg-gray-50 flex items-center justify-center text-[#172033] hover:bg-[#FF7033] hover:text-white transition-colors cursor-pointer">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"></path></svg>
                    </span>
                </div>
            </div>

            <!-- 3. Accounting -->
            <div class="bg-white border border-gray-100 rounded-2xl p-6 shadow-sm hover:shadow-md transition-all duration-300 flex flex-col justify-between">
                <div class="flex items-center space-x-4 mb-6">
                    <div class="w-14 h-14 bg-[#FF7033] rounded-2xl flex items-center justify-center shrink-0 shadow-md shadow-orange-200">
                        <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    </div>
                    <div>
                        <h3 class="text-base font-bold text-[#172033]">Accounting</h3>
                        <p class="text-xs text-gray-500 mt-0.5">158 Jobs Opened</p>
                    </div>
                </div>
                <div class="flex justify-end">
                    <span class="w-8 h-8 rounded-full bg-gray-50 flex items-center justify-center text-[#172033] hover:bg-[#FF7033] hover:text-white transition-colors cursor-pointer">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"></path></svg>
                    </span>
                </div>
            </div>

            <!-- 4. Photography -->
            <div class="bg-white border border-gray-100 rounded-2xl p-6 shadow-sm hover:shadow-md transition-all duration-300 flex flex-col justify-between">
                <div class="flex items-center space-x-4 mb-6">
                    <div class="w-14 h-14 bg-[#FFF3EE] rounded-2xl flex items-center justify-center shrink-0">
                        <svg class="w-7 h-7 text-[#FF7033]" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path><path stroke-linecap="round" stroke-linejoin="round" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                    </div>
                    <div>
                        <h3 class="text-base font-bold text-[#172033]">Photography</h3>
                        <p class="text-xs text-gray-500 mt-0.5">95 Jobs Opened</p>
                    </div>
                </div>
                <div class="flex justify-end">
                    <span class="w-8 h-8 rounded-full bg-gray-50 flex items-center justify-center text-[#172033] hover:bg-[#FF7033] hover:text-white transition-colors cursor-pointer">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"></path></svg>
                    </span>
                </div>
            </div>

            <!-- 5. Copy Writing -->
            <div class="bg-white border border-gray-100 rounded-2xl p-6 shadow-sm hover:shadow-md transition-all duration-300 flex flex-col justify-between">
                <div class="flex items-center space-x-4 mb-6">
                    <div class="w-14 h-14 bg-[#FFF3EE] rounded-2xl flex items-center justify-center shrink-0">
                        <svg class="w-7 h-7 text-[#FF7033]" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
                    </div>
                    <div>
                        <h3 class="text-base font-bold text-[#172033]">Copy Writing</h3>
                        <p class="text-xs text-gray-500 mt-0.5">113 Jobs Opened</p>
                    </div>
                </div>
                <div class="flex justify-end">
                    <span class="w-8 h-8 rounded-full bg-gray-50 flex items-center justify-center text-[#172033] hover:bg-[#FF7033] hover:text-white transition-colors cursor-pointer">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"></path></svg>
                    </span>
                </div>
            </div>

            <!-- 6. Music -->
            <div class="bg-white border border-gray-100 rounded-2xl p-6 shadow-sm hover:shadow-md transition-all duration-300 flex flex-col justify-between">
                <div class="flex items-center space-x-4 mb-6">
                    <div class="w-14 h-14 bg-[#FFF3EE] rounded-2xl flex items-center justify-center shrink-0">
                        <svg class="w-7 h-7 text-[#FF7033]" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3"></path></svg>
                    </div>
                    <div>
                        <h3 class="text-base font-bold text-[#172033]">Music</h3>
                        <p class="text-xs text-gray-500 mt-0.5">55 Jobs Opened</p>
                    </div>
                </div>
                <div class="flex justify-end">
                    <span class="w-8 h-8 rounded-full bg-gray-50 flex items-center justify-center text-[#172033] hover:bg-[#FF7033] hover:text-white transition-colors cursor-pointer">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"></path></svg>
                    </span>
                </div>
            </div>

            <!-- 7. Human Resources -->
            <div class="bg-white border border-gray-100 rounded-2xl p-6 shadow-sm hover:shadow-md transition-all duration-300 flex flex-col justify-between">
                <div class="flex items-center space-x-4 mb-6">
                    <div class="w-14 h-14 bg-[#FFF3EE] rounded-2xl flex items-center justify-center shrink-0">
                        <svg class="w-7 h-7 text-[#FF7033]" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                    </div>
                    <div>
                        <h3 class="text-base font-bold text-[#172033]">Human Resources</h3>
                        <p class="text-xs text-gray-500 mt-0.5">25 Jobs Opened</p>
                    </div>
                </div>
                <div class="flex justify-end">
                    <span class="w-8 h-8 rounded-full bg-gray-50 flex items-center justify-center text-[#172033] hover:bg-[#FF7033] hover:text-white transition-colors cursor-pointer">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"></path></svg>
                    </span>
                </div>
            </div>

            <!-- 8. Explore More Categories (Card สีส้ม) -->
            <div class="bg-[#FF7033] rounded-2xl p-6 text-white shadow-md flex flex-col justify-between relative overflow-hidden">
                <!-- ลวดลายพื้นหลังจางๆ -->
                <div class="absolute inset-0 opacity-15 pointer-events-none">
                    <svg class="w-full h-full" viewBox="0 0 100 100" preserveAspectRatio="none">
                        <path d="M0,20 Q30,40 60,10 T100,30 L100,100 L0,100 Z" fill="white"></path>
                    </svg>
                </div>
                <div class="relative z-10 mb-6">
                    <h3 class="text-xl font-bold leading-snug">Explore<br>30 More<br>Categories</h3>
                </div>
                <div class="flex justify-end relative z-10">
                    <span class="w-8 h-8 rounded-full bg-white/20 flex items-center justify-center text-white hover:bg-white hover:text-[#FF7033] transition-colors cursor-pointer">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"></path></svg>
                    </span>
                </div>
            </div>

        </div>
    </div>

</body>
</html>
