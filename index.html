<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Categories Section</title>
    <!-- โหลด Tailwind CSS และฟอนต์ Poppins -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;700&display=swap" rel="stylesheet">
    <style>
        .font-poppins {
            font-family: 'Poppins', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen p-4">

    <!-- Section หลัก -->
    <section class="max-w-6xl w-full mx-auto py-12 px-4 sm:px-6">
        
        <!-- หัวข้อประจำ Section (Heading) -->
        <div class="text-center mb-10">
            <h2 class="font-poppins font-bold text-3xl sm:text-4xl md:text-[40px] leading-tight md:leading-[50px] tracking-[0%] text-[#183B56]">
                Browse by <br />
                <span class="relative inline-block text-[#183B56] px-1">
                    Job
                    <!-- แถบสีส้มไฮไลต์ทับขึ้นมาถึงกึ่งกลางของตัวอักษร -->
                    <span class="absolute bottom-1.5 left-0 w-full h-[18px] bg-[#fba176] -z-10 rounded-xs"></span>
                </span>
                Categories
            </h2>
        </div>

        <!-- Grid แสดงการ์ดหมวดหมู่งาน (Responsive Layout - ปรับขอบมนกำลังดีด้วย rounded-xl) -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
            
            <!-- Card 1: Digital Marketing -->
            <div class="bg-white border border-gray-100 rounded-xl p-6 shadow-sm hover:shadow-md transition duration-200 flex flex-col justify-between h-48 group">
                <div class="w-12 h-12 rounded-full bg-[#ffedd5] flex items-center justify-center text-[#f97316]">
                    <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20"><path d="M18 3a1 1 0 00-1.447-.894L8.763 6H5a3 3 0 00-3 3v2a3 3 0 003 3h3.763l7.79 3.894A1 1 0 0018 17V3z"/></svg>
                </div>
                <div class="flex items-end justify-between mt-4">
                    <div>
                        <h3 class="font-bold text-lg text-[#183B56] group-hover:text-[#f97316] transition">Digital Marketing</h3>
                        <p class="text-xs text-[#183B56] opacity-70 font-medium mt-1">143 Jobs Opened</p>
                    </div>
                    <span class="text-[#183B56] group-hover:translate-x-1 transition-transform">➔</span>
                </div>
            </div>

            <!-- Card 2: Art & Design -->
            <div class="bg-white border border-gray-100 rounded-xl p-6 shadow-sm hover:shadow-md transition duration-200 flex flex-col justify-between h-48 group">
                <div class="w-12 h-12 rounded-full bg-[#ffedd5] flex items-center justify-center text-[#f97316]">
                    <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20"><path d="M13.586 3.586a2 2 0 112.828 2.828l-.793.793-2.828-2.828.793-.793zM11.379 5.793L3 14.172V17h2.828l8.38-8.379-2.83-2.828z"/></svg>
                </div>
                <div class="flex items-end justify-between mt-4">
                    <div>
                        <h3 class="font-bold text-lg text-[#183B56] group-hover:text-[#f97316] transition">Art & Design</h3>
                        <p class="text-xs text-[#183B56] opacity-70 font-medium mt-1">110 Jobs Opened</p>
                    </div>
                    <span class="text-[#183B56] group-hover:translate-x-1 transition-transform">➔</span>
                </div>
            </div>

            <!-- Card 3: Accounting -->
            <div class="bg-[#f8fafc] border border-transparent rounded-xl p-6 shadow-sm hover:shadow-md transition duration-200 flex flex-col justify-between h-48 group">
                <div class="w-12 h-12 rounded-full bg-[#f97316] text-white flex items-center justify-center font-bold text-xl shadow-inner">
                    $
                </div>
                <div class="flex items-end justify-between mt-4">
                    <div>
                        <h3 class="font-bold text-lg text-[#183B56] group-hover:text-[#f97316] transition">Accounting</h3>
                        <p class="text-xs text-[#183B56] opacity-70 font-medium mt-1">158 Jobs Opened</p>
                    </div>
                    <span class="text-[#183B56] group-hover:translate-x-1 transition-transform">➔</span>
                </div>
            </div>

            <!-- Card 4: Photography -->
            <div class="bg-white border border-gray-100 rounded-xl p-6 shadow-sm hover:shadow-md transition duration-200 flex flex-col justify-between h-48 group">
                <div class="w-12 h-12 rounded-full bg-[#ffedd5] flex items-center justify-center text-[#f97316]">
                    <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M4 5a2 2 0 00-2 2v8a2 2 0 002 2h12a2 2 0 002-2V7a2 2 0 00-2-2h-1.586a1 1 0 01-.707-.293l-1.414-1.414A1 1 0 0011.586 3H8.414a1 1 0 00-.707.293L6.293 4.707A1 1 0 015.586 5H4zm6 9a3 3 0 100-6 3 3 0 000 6z" clip-rule="evenodd"/></svg>
                </div>
                <div class="flex items-end justify-between mt-4">
                    <div>
                        <h3 class="font-bold text-lg text-[#183B56] group-hover:text-[#f97316] transition">Photography</h3>
                        <p class="text-xs text-[#183B56] opacity-70 font-medium mt-1">95 Jobs Opened</p>
                    </div>
                    <span class="text-[#183B56] group-hover:translate-x-1 transition-transform">➔</span>
                </div>
            </div>

            <!-- Card 5: Copy Writing -->
            <div class="bg-white border border-gray-100 rounded-xl p-6 shadow-sm hover:shadow-md transition duration-200 flex flex-col justify-between h-48 group">
                <div class="w-12 h-12 rounded-full bg-[#ffedd5] flex items-center justify-center text-[#f97316]">
                    <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20"><path d="M17.414 2.586a2 2 0 00-2.828 0L7 10.172V13h2.828l7.586-7.586a2 2 0 000-2.828z"/><path fill-rule="evenodd" d="M2 6a2 2 0 012-2h4a1 1 0 010 2H4v10h10v-4a1 1 0 112 0v4a2 2 0 01-2 2H4a2 2 0 01-2-2V6z" clip-rule="evenodd"/></svg>
                </div>
                <div class="flex items-end justify-between mt-4">
                    <div>
                        <h3 class="font-bold text-lg text-[#183B56] group-hover:text-[#f97316] transition">Copy Writing</h3>
                        <p class="text-xs text-[#183B56] opacity-70 font-medium mt-1">113 Jobs Opened</p>
                    </div>
                    <span class="text-[#183B56] group-hover:translate-x-1 transition-transform">➔</span>
                </div>
            </div>

            <!-- Card 6: Music -->
            <div class="bg-white border border-gray-100 rounded-xl p-6 shadow-sm hover:shadow-md transition duration-200 flex flex-col justify-between h-48 group">
                <div class="w-12 h-12 rounded-full bg-[#ffedd5] flex items-center justify-center text-[#f97316]">
                    <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M18 3a1 1 0 00-1.196-.98l-10 2A1 1 0 006 5v9.114A4.369 4.369 0 005 14c-1.657 0-3 1.343-3 3s1.343 3 3 3 3-1.343 3-3V7.82l8-1.6v5.894A4.37 4.37 0 0015 12c-1.657 0-3 1.343-3 3s1.343 3 3 3 3-1.343 3-3V3z" clip-rule="evenodd"/></svg>
                </div>
                <div class="flex items-end justify-between mt-4">
                    <div>
                        <h3 class="font-bold text-lg text-[#183B56] group-hover:text-[#f97316] transition">Music</h3>
                        <p class="text-xs text-[#183B56] opacity-70 font-medium mt-1">55 Jobs Opened</p>
                    </div>
                    <span class="text-[#183B56] group-hover:translate-x-1 transition-transform">➔</span>
                </div>
            </div>

            <!-- Card 7: Human Resources -->
            <div class="bg-white border border-gray-100 rounded-xl p-6 shadow-sm hover:shadow-md transition duration-200 flex flex-col justify-between h-48 group">
                <div class="w-12 h-12 rounded-full bg-[#ffedd5] flex items-center justify-center text-[#f97316]">
                    <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd"/></svg>
                </div>
                <div class="flex items-end justify-between mt-4">
                    <div>
                        <h3 class="font-bold text-lg text-[#183B56] group-hover:text-[#f97316] transition">Human Resouces</h3>
                        <p class="text-xs text-[#183B56] opacity-70 font-medium mt-1">25 Jobs Opened</p>
                    </div>
                    <span class="text-[#183B56] group-hover:translate-x-1 transition-transform">➔</span>
                </div>
            </div>

            <!-- Card 8: Explore 30 More Categories (ปรับมุมมน rounded-xl) -->
            <div class="bg-[#f97316] rounded-xl px-8 py-6 shadow-md hover:shadow-lg transition duration-200 flex items-center justify-between w-full h-48 text-white relative overflow-hidden group cursor-pointer">
                <!-- เส้นลวดลายพื้นหลัง -->
                <div class="absolute inset-0 opacity-15 pointer-events-none">
                    <svg class="w-full h-full" viewBox="0 0 100 100" preserveAspectRatio="none">
                        <path d="M0 25 Q 50 45 100 25 T 200 25" stroke="white" stroke-width="1.5" fill="none"/>
                        <path d="M0 75 Q 50 95 100 75 T 200 75" stroke="white" stroke-width="1.5" fill="none"/>
                    </svg>
                </div>

                <!-- ข้อความขยับมาทางขวา pl-6 -->
                <h3 class="font-poppins font-medium text-[18px] leading-[26px] tracking-[0.2px] text-white z-10 pl-6">
                    Explore <br/> 30 More <br/> Categories
                </h3>
                
                <!-- ลูกศรขวา -->
                <span class="text-xl text-white group-hover:translate-x-1.5 transition-transform z-10">➔</span>
            </div>

        </div>
    </section>

</body>
</html>
